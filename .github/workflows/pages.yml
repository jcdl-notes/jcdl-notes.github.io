name: 资料库维护
run-name: 资料库维护
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xinhuo-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/check.mjs --rebuild
      - name: Install PDF renderer
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils fonts-noto-cjk
      - uses: actions/cache@v4
        with:
          path: .preview-cache
          key: ${{ runner.os }}-pdf-v1-${{ hashFiles('docs/data/library.js', 'docs/files/**/*.pdf', 'tools/build-previews.mjs') }}
          restore-keys: ${{ runner.os }}-pdf-v1-
      - run: node tools/build-previews.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
