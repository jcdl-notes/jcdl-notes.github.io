<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>芯火相传 · 资料管理端</title>
  <link rel="stylesheet" href="../assets/site.css">
  <script defer src="../assets/catalog.js?v=large-pdfs"></script>
  <script defer src="editor.js?v=download-stats"></script>
</head>
<body>
<header class="top"><div class="wrap top-row">
  <a class="brand" href="/"><img class="college-logo" src="../assets/college-logo.jpg" alt="学院院徽" width="42" height="42"><span>芯火相传<small>资料管理端</small></span></a>
  <nav class="admin-nav" aria-label="站点入口">
    <a id="public-site" href="https://jcdl-notes.github.io/" target="_blank" rel="noopener">打开正式学生端 ↗</a>
    <a href="/" target="_blank" rel="noopener">本地预览 ↗</a>
  </nav>
</div></header>
<main class="wrap editor">
  <h1>上传复习资料</h1>
  <div class="publish-panel"><p id="sync-status" aria-live="polite"></p><a id="deployments" href="https://github.com/jcdl-notes/jcdl-notes.github.io/actions" target="_blank" rel="noopener">查看发布进度 ↗</a><button id="retry" class="action" type="button" hidden>重试发布</button></div>
  <p id="edit-status" role="status"></p>
  <section class="editor-box" aria-labelledby="traffic-title">
    <div class="admin-list-head">
      <h2 id="traffic-title">学生端访问统计</h2>
      <button type="button" class="action" id="refresh-traffic">刷新统计</button>
    </div>
    <p id="traffic-status" role="status">正在读取统计…</p>
    <div class="editor-fields" id="traffic-summary" hidden>
      <div><strong>今日</strong><p>访问次数 <b id="traffic-today-views"></b> · 访客人数 <b id="traffic-today-visitors"></b></p></div>
      <div><strong>启用以来</strong><p>访问次数 <b id="traffic-total-views"></b> · 访客人数 <b id="traffic-total-visitors"></b></p></div>
    </div>
  </section>
  <form id="upload" class="editor-box">
    <div class="editor-fields">
      <label>届次<select name="edition" required></select></label>
      <label>课程<select name="course" required></select></label>
      <label class="wide">选择 PDF<input name="pdf" type="file" accept=".pdf,application/pdf" multiple required></label>
      <label class="checkbox"><input type="checkbox" name="featured">标记为优秀资料</label>
    </div>
    <p>可一次选择同一门课的多份 PDF。连接正式站时，单份上限 512 MiB，超过 25 MiB 的文件会自动上传到 GitHub 附件。</p>
    <div class="upload-details">
      <p class="section-kicker">资料信息（可选）</p>
      <div class="editor-fields">
        <label>公开署名<input name="credit" maxlength="60"></label>
        <label>知识点<input name="topics" maxlength="240" placeholder="如：相量、正弦稳态"></label>
        <label>资料类别<select name="kind"><option>其他复习资料</option><option>完整笔记</option><option>专题笔记</option><option>习题整理</option></select></label>
      </div>
    </div>
    <p><button class="action" type="submit">上传并更新目录</button></p>
  </form>
  <section class="editor-box">
    <h2>管理届次与课程</h2>
    <form id="category" class="editor-fields">
      <label>新增类型<select name="type"><option value="courses">课程</option><option value="editions">届次</option><option value="terms">课程学期</option></select></label>
      <label id="term-label">所属学期<select name="term"></select></label>
      <label>名称<input name="label" maxlength="80" required placeholder="例如 模拟电子技术"></label>
      <div><button class="action" type="submit">添加</button></div>
    </form>
    <form class="editor-fields" id="course-management">
      <label>已建课程<select id="manage-course"></select></label>
      <p id="course-state" role="status"></p>
      <label id="course-name-field" hidden>课程名称<input id="course-name" maxlength="80" required></label>
      <div class="entry-actions">
        <button class="action" type="submit" id="course-rename" hidden>保存课程名称</button>
        <button class="action" type="button" id="course-visibility" hidden>下架课程</button>
        <button class="action danger" type="button" id="course-delete" hidden>删除课程</button>
      </div>
      <p id="course-operation-status" role="status"></p>
    </form>
  </section>
  <section class="editor-box">
    <div class="admin-list-head"><h2>已收录资料</h2><span id="entry-count"></span></div>
    <div class="admin-filters">
      <label>搜索<input id="note-search" type="search" placeholder="标题、署名、课程或知识点"></label>
      <label>届次<select id="note-edition"></select></label>
      <label>课程<select id="note-course"></select></label>
      <label class="checkbox"><input id="note-featured" type="checkbox">只看优秀</label>
    </div>
    <ul id="entries" class="entry-list"></ul>
  </section>
  <dialog id="edit-note" aria-labelledby="note-title"><div class="dialog-inner">
    <form method="dialog"><button type="submit" class="close" aria-label="关闭编辑">×</button></form>
    <h2 id="note-title">编辑资料</h2>
    <form id="edit-form" class="editor-fields">
      <label class="wide">资料标题<input name="title" maxlength="120" required></label>
      <label>届次<select name="edition" required></select></label>
      <label>课程<select name="course" required></select></label>
      <label>公开署名<input name="credit" maxlength="60"></label>
      <label>知识点<input name="topics" maxlength="240" placeholder="如：相量、正弦稳态"></label>
      <label>资料类别<select name="kind"></select></label>
      <label class="checkbox"><input type="checkbox" name="featured">标记为优秀资料</label>
      <label class="wide">替换 PDF（可选）<input name="pdf" type="file" accept=".pdf,application/pdf"></label>
      <p class="wide" id="edit-note-status" role="status"></p>
      <div class="wide"><button type="submit" class="action">保存修改</button></div>
    </form>
  </div></dialog>
</main>
</body>
</html>
